chapters:
  - all:
    - algorithms
    - arkui
    - escompat
    - koala-related-benchmarks
    - regression
    - spec
    - std

  # One folder - one chapter
  - algorithms-dir:
    - algorithms
  - arkui-dir:
    - arkui
  - escompat-dir:
    - escompat
  - koala-related-benchmarks-dir:
    - koala-related-benchmarks
  - regression-dir:
    - regression
  - std-containers-dir:
    - std/containers
  - std-core-dir:
    - std/core
  - std-math-dir:
    - std/math
  - std-time-dir:
    - std/time
  - std-serialization-dir:
    - std/serialization
  - spec1:
    - spec/conditional-expression
    - spec/generic
    - spec/import_export
    - spec/lambda
    - spec/never_type
    - spec/rest-params
    - spec/string_enum
    - spec/struct-type
    - spec/trailing_lambdas
    - spec/undefined-type
  - spec2:
    - spec
    - exclude:
      - spec1

  # chapters by several folders
  - std-core-reflect1:
    - 'ets-func-tests-templates/std/core/test-ClassGetInstanceMethodByName-*.ets'
  - std-core1:
    - 'std/core/BadRadixTest*.ats'
    - 'std/core/EscapeUnescapeTest*.ats'
    - 'std/core/EscapeUnescapeURITest*.ats'
    - 'std/core/GoodRadixTest*.ats'
    - 'std/core/SortInternalTestLong*.ats'
    - 'std/core/SortInternalTest*.ats'
    - 'std/core/SortNotFromBeginningTest*.ats'
    - 'std/core/SortStringsTest*.ats'
    - 'std/core/StringAtExceptionTest*.ats'
    - 'std/core/TypeAssignableFromTest*.ats'
    - 'std/core/TypeCreateErasedBodyTest*.ats'
    - 'std/core/TypeMethodInvoke*.ats'
    - 'std/core/TypeMethodInvokeConstructor*.ats'
    - 'std/core/TypeMethodInvokeVirt*.ats'
    - 'std/core/TypeMethodResolveConstructor*.ats'
    - 'std/core/TypeMethodResolveConstructorFew*.ats'
    - 'std/core/TypeResolve*.ats'
  - std-core2:
    - 'std/core/std_core_array*.ats'
    - 'std/core/std_core_array_exception*.ats'
  - std-core3:
    - 'std/core/std_core_boolean*.ats'
    - 'std/core/std_core_byte*.ats'
    - 'std/core/std_core_char*.ats'
    - 'std/core/std_core_constructor*.ats'
    - 'std/core/std_core_double*.ats'
    - 'std/core/std_core_float*.ats'
    - 'std/core/std_core_int*.ats'
    - 'std/core/std_core_long*.ats'
    - 'std/core/std_core_regexp*.ats'
    - 'std/core/std_core_short*.ats'
    - 'std/core/std_core_string*.ats'
    - 'std/core/std_core_stringbuilder*.ats'
  - std-core4:
    - std/core
    - exclude:
      - "std-core1"
      - "std-core2"
      - "std-core3"
  - escompat1:
    - 'escompat/escompat_typedarrays*.ats'
    - 'escompat/escompat_typeduarrays*.ats'

  - jit-preheat-low:
    - "std-core-reflect1"

  - jit-preheat-high:
    - '*'
    - exclude:
      - "jit-preheat-low"

  - not-specified:
    - '*'
    - exclude:
      - all
