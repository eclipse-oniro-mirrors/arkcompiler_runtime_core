---

cases:
#0
  - decl: |-
      n: number|undefined = 42
    check: |-
      function main() {
          arktest.assertEQ(new C().n, 42)
      }
    doc: optional property is implemented as union
#1
  - decl: |-
      get n(): number|undefined {
         return 1
      }
      set n(i: number|undefined) {}
    check: |-
      function main() {
          let a: C = new C()
          arktest.assertEQ(a.n, 1)
          a.n = 41
          arktest.assertEQ(a.n, 1)
      }
    doc: optional property is implemented as getter and setter
#2
  - decl: |-
     m: number|undefined
     get n(): number|undefined {
         return this.m
     }
     set n(i: number|undefined) {
         this.m = i
     }
    check: |-
      function main() {
          let a: C = new C()
          arktest.assertEQ(a.n, undefined)
          a.n = 41
          arktest.assertEQ(a.n, 41)
      }
    doc: optional property is implemented as accessors backed by a field
#3
  - decl: |-
      n?: number
    check: |-
      function main() {
          let a: C = new C()
          arktest.assertEQ(a.n, undefined)
          a.n = 2
          arktest.assertEQ(a.n, 2)
      }
    doc: optional property is implemented as an optional field
