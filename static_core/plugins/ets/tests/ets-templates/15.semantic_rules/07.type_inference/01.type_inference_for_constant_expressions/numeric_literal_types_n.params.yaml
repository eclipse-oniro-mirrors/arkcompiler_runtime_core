---
cases:
- expected_out: 'Semantic error ESE0318: Type ''Int'' cannot be assigned to type ''Byte|String'''
  use: '127'
  use_type: ': byte | string'
  value: '128'
- expected_out: 'Semantic error ESE0255: Ambiguous union type operation'
  use: 3.4e39
  use_type: ': float | double'
  value: '1'
- expected_out: 'Semantic error ESE0318: Type ''Int'' cannot be assigned to type ''Short'''
  use: '127'
  use_type: ': short'
  value: (2147483647).toInt()
- expected_out: 'Semantic error ESE0318: Type ''Long'' cannot be assigned to type
    ''Int'''
  use: '2147483647'
  use_type: ': int'
  value: (9223372036854775807).toLong()
- expected_out: 'Semantic error ESE0318: Type ''Double'' cannot be assigned to type
    ''Long'''
  use: '1'
  use_type: ': long'
  value: '1.0'
- expected_out: 'Semantic error ESE0318: Type ''Int'' cannot be assigned to type ''Byte'''
  use: '127'
  use_type: ': byte'
  value: '128'
- expected_out: 'Semantic error ESE0318: Type ''Double'' cannot be assigned to type
    ''Float'''
  use: 123f
  use_type: ': float'
  value: '3.14'
