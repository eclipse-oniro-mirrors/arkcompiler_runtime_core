module:
  name: paoc
  namespace: ark::paoc
  description: Application to compile panda files

options:
  - name: paoc-panda-files
    type: arg_list_t
    default: []
    description: Set list of panda files to compile
    delimiter: ","

  - name: paoc-location
    type: std::string
    default: ""
    description: Location path of the input panda file, that will be written into the AOT file. Makes --aot-verify-abs-path option have no effect.

  - name: paoc-boot-location
    type: std::string
    default: ""
    description: Location path of the boot panda files, that will be written into the AOT file. Makes --aot-verify-abs-path option have no effect.

  - name: paoc-skip-until
    type: std::string
    default: ""
    description: Set first method to complie and skip all previous

  - name: paoc-compile-until
    type: std::string
    default: ""
    description: Set last method to complie and skip all following

  - name: paoc-mode
    type: std::string
    default: aot
    possible_values:
      - aot
      - llvm
      - jit
      - osr
    description: Specify compiler mode

  - name: paoc-clusters
    type: std::string
    default: none
    description: Path to `paoc-clusters` file

  - name: paoc-dump-stats-csv
    type: std::string
    default: none
    description: Dump allocator usage statistics, less verbose than `--compiler-dump-stats-csv`

  - name: paoc-output
    type: std::string
    default: out.an
    description: Output file path

  - name: paoc-boot-output
    type: std::string
    default: boot.an
    description: Output boot file path. CHA will not be validated. Incompatible with --paoc-output

  - name: paoc-methods-from-file
    description: Use white or black lists to filter methods to compile
    sub_options:
    - name: path
      type: std::string
      default: none
      description: Path to the file which contains methods
    - name: iswhite
      type: bool
      default: true
      description: use the file as white or black list

  - name: paoc-generate-symbols
    type: bool
    default: false
    description: Generate symbols for compiled methods (always true in debug builds)

  - name: paoc-compress-symbols
    type: bool
    default: false
    description: "Pack all method symbols (full names) into an xz-compressed mini ELF stored in the non-ALLOC .gnu_debugdata section; .dynsym keeps only the 4 section-marker symbols. Full names remain available offline via llvm-symbolizer after extracting .gnu_debugdata. Defaults to true for 64-bit targets (arm64, x86_64) and false for 32-bit targets (which fall back to full symbols with a warning anyway); an explicit flag always overrides. Pre-condition --paoc-generate-symbols must be enabled; in release builds it defaults to off (forced on in debug builds), so on 64-bit release targets pass --paoc-generate-symbols to make the compression effective. If runtime compression fails, the mini ELF is stored uncompressed instead of being dropped. Requires a compression backend at build time: the 7-Zip SDK (configure PANDA_LZMA_SDK_ROOT). If it is not available, this option is a no-op (ark_aot falls back to full symbols with a warning and the product has no .gnu_debugdata section)"

  - name: paoc-skip-cctor
    type: bool
    default: false
    description: "Skip AOT compilation of class constructors (<cctor>). Semantics are preserved: the runtime falls back to the interpreter for class initialization (one-time cost per class). Saves the native code of all cctors (~170 KB for etsstdlib). With --paoc-skip-until or --paoc-compile-until, a cctor at the boundary is itself skipped but the boundary still takes effect"

  - name: paoc-use-cha
    type: bool
    default: true
    description: Use class hierarchy during compilation

  - name: paoc-verbose
    type: bool
    default: false
    description: Enable all logs, related to the paoc

  - name: paoc-boot-panda-locations
    type: arg_list_t
    default: []
    description: Location paths of the each boot panda file, including file names, that will be written into the AOT file. Makes --aot-verify-abs-path option have no effect.
    delimiter: ":"

  - name: paoc-zip-panda-file
    type: std::string
    default: ""
    description: Path of the panda file in zip

  - name: paoc-compilation-limit
    type: uint64_t
    default: 0
    description: Time limit for the whole AOT compilation in milliseconds (0 means no limit)

  - name: paoc-an-fd
    type: int
    default: -1
    description: File descriptor for .an file passed from compiler_service

  - name: paoc-hap-fd
    type: int
    default: -1
    description: File descriptor for HAP file passed from compiler_service

  - name: paoc-use-profile
    description: Load and use AOT profile information
    sub_options:
    - name: path
      type: std::string
      default: none
      description: Path to the file with AOT profile information
    - name: force
      type: bool
      default: false
      description: Crash if profiling file is missing or broken
